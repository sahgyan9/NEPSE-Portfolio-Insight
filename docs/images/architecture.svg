<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Architecture: a browser app talks to two local Python services that read and write JSON files on your disk. Market data comes from public websites. Nothing about your holdings leaves the computer.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1200" height="560" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>

  <g font-family="Inter, 'Segoe UI', 'Noto Sans', Arial, sans-serif">
    <!-- Your computer boundary -->
    <rect x="30" y="30" width="790" height="500" rx="14" fill="none" stroke="#1842b4" stroke-width="1.5" stroke-dasharray="7 6"/>
    <text x="50" y="60" font-size="15" font-weight="700" fill="#1842b4">YOUR COMPUTER</text>

    <!-- Browser -->
    <rect x="60" y="80" width="730" height="92" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="84" y="116" font-size="19" font-weight="700" fill="#0f172a">Browser app</text>
    <text x="84" y="144" font-size="14.5" fill="#475569">React, TypeScript, Tailwind, shadcn-ui. Nepali and English. Served locally on port 5175.</text>

    <!-- arrows browser to services -->
    <line x1="235" y1="178" x2="235" y2="226" stroke="#64748b" stroke-width="2" marker-end="url(#a)" marker-start="url(#b)"/>
    <line x1="615" y1="178" x2="615" y2="226" stroke="#64748b" stroke-width="2" marker-end="url(#a)" marker-start="url(#b)"/>

    <!-- Portfolio service -->
    <rect x="60" y="232" width="350" height="112" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="84" y="266" font-size="18" font-weight="700" fill="#0f172a">Portfolio service</text>
    <text x="84" y="290" font-size="14" fill="#1842b4" font-family="'JetBrains Mono', Consolas, monospace">portfolio_db.py  :5001</text>
    <text x="84" y="316" font-size="14" fill="#475569">Holdings, transactions, watchlist,</text>
    <text x="84" y="334" font-size="14" fill="#475569">risk, health and EPS analysis.</text>

    <!-- Market service -->
    <rect x="440" y="232" width="350" height="112" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="464" y="266" font-size="18" font-weight="700" fill="#0f172a">Market data service</text>
    <text x="464" y="290" font-size="14" fill="#1842b4" font-family="'JetBrains Mono', Consolas, monospace">nepse_server.py  :8002</text>
    <text x="464" y="316" font-size="14" fill="#475569">Live prices, dividends, news,</text>
    <text x="464" y="334" font-size="14" fill="#475569">quarterly reports, sector screen.</text>

    <!-- arrows services to disk -->
    <line x1="235" y1="350" x2="235" y2="394" stroke="#64748b" stroke-width="2" marker-end="url(#a)" marker-start="url(#b)"/>
    <line x1="615" y1="350" x2="615" y2="394" stroke="#64748b" stroke-width="2" marker-end="url(#a)" marker-start="url(#b)"/>

    <!-- Disk -->
    <rect x="60" y="400" width="730" height="106" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="84" y="434" font-size="18" font-weight="700" fill="#0f172a">JSON files in db/</text>
    <text x="84" y="460" font-size="14" fill="#475569"><tspan font-family="'JetBrains Mono', Consolas, monospace" fill="#0f172a">portfolio.json</tspan> holds your shares. It is git-ignored and never uploaded.</text>
    <text x="84" y="484" font-size="14" fill="#475569">Prices, quarterly reports, fundamentals, dividends and news are stored beside it.</text>

    <!-- Internet column -->
    <text x="870" y="60" font-size="15" font-weight="700" fill="#475569">PUBLIC WEBSITES (READ ONLY)</text>

    <rect x="870" y="80" width="300" height="64" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="890" y="107" font-size="15.5" font-weight="700" fill="#0f172a">NEPSE</text>
    <text x="890" y="129" font-size="13.5" fill="#475569">Live prices and the index</text>

    <rect x="870" y="158" width="300" height="64" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="890" y="185" font-size="15.5" font-weight="700" fill="#0f172a">ShareSansar</text>
    <text x="890" y="207" font-size="13.5" fill="#475569">Company news and notices</text>

    <rect x="870" y="236" width="300" height="64" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="890" y="263" font-size="15.5" font-weight="700" fill="#0f172a">NepseAlpha</text>
    <text x="890" y="285" font-size="13.5" fill="#475569">Quarterly reports</text>

    <rect x="870" y="314" width="300" height="64" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="890" y="341" font-size="15.5" font-weight="700" fill="#0f172a">Merolagani</text>
    <text x="890" y="363" font-size="13.5" fill="#475569">Daily price history</text>

    <!-- arrow from sources to market service -->
    <path d="M864,268 L800,280" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
    <text x="846" y="254" font-size="12" fill="#64748b" text-anchor="middle">data in</text>

    <!-- Optional AI -->
    <rect x="870" y="420" width="300" height="86" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-dasharray="6 5"/>
    <text x="890" y="449" font-size="15.5" font-weight="700" fill="#0f172a">Google Gemini (optional)</text>
    <text x="890" y="471" font-size="13.5" fill="#475569">AI chat, only if you add your own key.</text>
    <text x="890" y="490" font-size="13.5" fill="#475569">Called straight from the browser.</text>
  </g>
</svg>
