<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" width="1200" height="290" role="img" aria-label="How it works in four steps: import from Meroshare, data fills in, read it in plain words, check before you decide.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1200" height="290" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>

  <g font-family="Inter, 'Segoe UI', 'Noto Sans', 'Noto Sans Devanagari', 'Nirmala UI', Mangal, Arial, sans-serif">
    <!-- Step 1 -->
    <g transform="translate(30,30)">
      <rect width="255" height="230" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      <circle cx="38" cy="42" r="18" fill="#1842b4"/>
      <text x="38" y="48" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">1</text>
      <text x="20" y="98" font-size="19" font-weight="700" fill="#0f172a">Import from Meroshare</text>
      <text x="20" y="126" font-size="16" font-weight="600" fill="#1842b4">मेरो सेयरबाट ल्याउनुहोस्</text>
      <text font-size="14" fill="#475569">
        <tspan x="20" y="164">Drop in the CSV file you</tspan>
        <tspan x="20" y="184">download from Meroshare.</tspan>
        <tspan x="20" y="204">No typing of shares or prices.</tspan>
      </text>
    </g>
    <line x1="291" y1="145" x2="312" y2="145" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Step 2 -->
    <g transform="translate(320,30)">
      <rect width="255" height="230" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      <circle cx="38" cy="42" r="18" fill="#1842b4"/>
      <text x="38" y="48" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">2</text>
      <text x="20" y="98" font-size="19" font-weight="700" fill="#0f172a">Data fills in by itself</text>
      <text x="20" y="126" font-size="16" font-weight="600" fill="#1842b4">डाटा आफैँ आउँछ</text>
      <text font-size="14" fill="#475569">
        <tspan x="20" y="164">Prices, dividends, quarterly</tspan>
        <tspan x="20" y="184">reports and company news</tspan>
        <tspan x="20" y="204">load for the shares you hold.</tspan>
      </text>
    </g>
    <line x1="581" y1="145" x2="602" y2="145" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Step 3 -->
    <g transform="translate(610,30)">
      <rect width="255" height="230" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      <circle cx="38" cy="42" r="18" fill="#1842b4"/>
      <text x="38" y="48" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">3</text>
      <text x="20" y="98" font-size="19" font-weight="700" fill="#0f172a">Read it in plain words</text>
      <text x="20" y="126" font-size="16" font-weight="600" fill="#1842b4">सजिलो भाषामा बुझ्नुहोस्</text>
      <text font-size="14" fill="#475569">
        <tspan x="20" y="164">Profit, loss and risk as short</tspan>
        <tspan x="20" y="184">sentences in Nepali or English.</tspan>
        <tspan x="20" y="204">Charts are one click away.</tspan>
      </text>
    </g>
    <line x1="871" y1="145" x2="892" y2="145" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Step 4 -->
    <g transform="translate(900,30)">
      <rect width="270" height="230" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      <circle cx="38" cy="42" r="18" fill="#1842b4"/>
      <text x="38" y="48" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">4</text>
      <text x="20" y="98" font-size="19" font-weight="700" fill="#0f172a">Check before you decide</text>
      <text x="20" y="126" font-size="16" font-weight="600" fill="#1842b4">निर्णय अघि जाँच्नुहोस्</text>
      <text font-size="14" fill="#475569">
        <tspan x="20" y="164">Lessons, a glossary and a</tspan>
        <tspan x="20" y="184">research checklist. The app</tspan>
        <tspan x="20" y="204">never says buy or sell.</tspan>
      </text>
    </g>
  </g>
</svg>
